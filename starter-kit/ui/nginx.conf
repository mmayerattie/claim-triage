server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Photos plus a PDF can exceed nginx's 1 MB default.
    client_max_body_size 30m;

    # Same-origin proxy: the page calls /api/... and nginx forwards to the API container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
